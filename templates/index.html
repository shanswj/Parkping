<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ParkPing</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app">
    <header>
        <div class="logo">Park<span>Ping</span></div>
        <div id="modeSwitch" class="mode-switch">
            <button data-mode="look">I'm looking</button>
            <button data-mode="leave">I'm leaving</button>
        </div>
    </header>

    <!-- The street: a row of bays, the road, another row of bays. app.js fills the rows. -->
    <section class="street">
        <div id="topRow" class="bay-row"></div>
        <div class="road"></div>
        <div id="bottomRow" class="bay-row"></div>
    </section>
    <div id="legend" class="legend"></div>

    <!-- Changes with the mode and the bay you tapped. -->
    <section id="sheet" class="card" aria-live="polite"></section>

    <!-- How busy parking usually is, from the dataset. -->
    <section id="outlook" class="card"></section>

    <footer>
        <span>Demo street. Bays and the hourly pattern come from the Kaggle parking dataset, not live George Town data.</span>
        <button id="resetButton" class="link-button">Reset demo</button>
    </footer>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
